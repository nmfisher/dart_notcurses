name: dart_notcurses
description: Dart bindings for NotCurses
version: 0.0.1
repository: https://github.com/kascote/dart_notcurses
homepage: https://github.com/kascote/dart_notcurses


# The build-hook (hooks/code_assets) + @Native code-asset stack needs a
# recent SDK; Native.addressOf needs >=3.3.
environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  characters: ^1.2.0
  code_assets: ^1.0.0
  ffi: ^2.0.0
  hooks: ^1.0.0
  native_toolchain_c: ^0.17.1
  logging: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^1.0.0
  ffigen: ^20.1.0
  test: ^1.24.0

dependency_overrides:
  file: ^7.0.0
  test: ^1.31.0
  frontend_server_client: ^4.0.0
