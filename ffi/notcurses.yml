# Main notcurses bindings, generated from the VENDORED headers in
# native/include (the same headers native/src/*.c compiles against) — never
# from a system notcurses install, which could be a different version than
# the vendored static library.
#
# ffi-native mode: emits top-level @Native externals bound to the code asset
# the build hook declares (hook/build.dart, assetName: 'dart_notcurses.dart').
# The Dart SDK resolves the asset; there is no dlopen anywhere.
#
# Regenerate with tool/regen_bindings.sh.
output: '../lib/src/ffi/notcurses_g.dart'
ffi-native:
  asset-id: 'package:dart_notcurses/dart_notcurses.dart'
description: 'Notcurses binding for Dart'
headers:
  entry-points:
    - '../native/include/notcurses/notcurses.h'
    - '../native/include/notcurses/direct.h'
  include-directives:
    - '../native/include/notcurses/notcurses.h'
    - '../native/include/notcurses/direct.h'
# NOTE: compiler-opts paths resolve from the working directory, not this
# config file — run ffigen from the package root (tool/regen_bindings.sh).
compiler-opts:
  - '-Inative/include'
compiler-opts-automatic:
  macos:
    include-c-standard-library: true
silence-enum-warning: true
enums:
  as-int:
    include:
      - '.*'
  exclude:
    - _.*
functions:
  include:
    - notcurses.*
    - nccell.*
    - ncstrwidth.*
    - ncchannel.*
    - ncdirect.*
    - ncplane.*
    - ncfadectx.*
    - ncfdplane.*
    - ncsubproc.*
    - nckey.*
    - ncinput.*
    - cnotcurses.*
    - ncmenu.*
    - ncmultiselector.*
    - ncpalette.*
    - ncpile.*
    - ncvisual.*
    - ncuplot.*
    - ncprogbar.*
    - ncreader.*
    - ncreel.*
    - nctablet.*
    - ncselector.*
    - nctab.*
    - nctree.*
  exclude:
    - _.*
    # Variadic printf-style functions cannot be called correctly through
    # dart:ffi (undefined behavior if invoked); don't bind them.
    - 'ncplane_printf.*'
    - 'ncplane_vprintf.*'
structs:
  exclude:
    - _.*
unions:
  exclude:
    - _.*
macros:
  exclude:
    - _.*
globals:
  exclude:
    - _.*
typedefs:
  exclude:
    - _.*
preamble: |
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_element
  // ignore_for_file: unused_field
  // ignore_for_file: constant_identifier_names
