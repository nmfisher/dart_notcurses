output: '../lib/src/ffi/notcurses_g.dart'
name: 'NcFfi'
description: 'Notcurses binding for Dart'
headers:
  entry-points:
    # macOS
    # - '/usr/local/opt/notcurses/include/notcurses/notcurses.h'
    # - '/usr/local/opt/notcurses/include/notcurses/direct.h'
    # Linux
    - '/usr/local/include/notcurses/notcurses.h'
    - '/usr/local/include/notcurses/direct.h'
  include-directives:
    # macOS
    # - '/usr/local/opt/notcurses/include/notcurses/notcurses.h'
    # - '/usr/local/opt/notcurses/include/notcurses/direct.h'
    # Linux
    - '/usr/local/include/notcurses/notcurses.h'
    - '/usr/local/include/notcurses/direct.h'
compiler-opts:
    # macOS
    # - '-I/usr/local/opt/notcurses/include'
    # Linux
    - '-I/usr/local/include'
compiler-opts-automatic:
  macos:
    include-c-standard-library: true
silence-enum-warning: true
enums:
  as-int:
    include:
      - '.*'
  exclude:
    - _.*
functions:
  include:
    - notcurses.*
    - nccell.*
    - ncstrwidth.*
    - ncchannel.*
    - ncdirect.*
    - ncplane.*
    - ncfadectx.*
    - ncfdplane.*
    - ncsubproc.*
    - nckey.*
    - ncinput.*
    - cnotcurses.*
    - ncmenu.*
    - ncmultiselector.*
    - ncpalette.*
    - ncpile.*
    - ncvisual.*
    - ncuplot.*
    - ncprogbar.*
    - ncreader.*
    - ncreel.*
    - nctablet.*
    - ncselector.*
    - nctab.*
    - nctree.*
  exclude:
    - _.*
structs:
  exclude:
    - _.*
unions:
  exclude:
    - _.*
macros:
  exclude:
    - _.*
globals:
  exclude:
    - _.*
typedefs:
  exclude:
    - _.*
preamble: |
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_element
  // ignore_for_file: unused_field
  // ignore_for_file: constant_identifier_names
